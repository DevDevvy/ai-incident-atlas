name: "Correct or update an existing incident"
description: "Propose a factual correction, stronger source, classification change, or material update."
title: "[Update incident]: "
labels: ["correction", "needs-verification"]
body:
  - type: input
    id: existing_incident
    attributes:
      label: Existing incident title
      description: Usually prefilled automatically when you start from the Atlas.
    validations: { required: true }
  - type: input
    id: incident_id
    attributes:
      label: Incident ID
      description: Stable Atlas record ID. The site pre-fills this for you.
    validations: { required: true }
  - type: input
    id: fields_changed
    attributes:
      label: Fields changed
      description: Comma-separated summary of the fields being updated. The Atlas editor fills this automatically.
    validations: { required: true }
  - type: textarea
    id: problem
    attributes:
      label: Why is this update needed?
      description: Explain what is wrong, incomplete, outdated, or newly established.
    validations: { required: true }
  - type: textarea
    id: proposed_change
    attributes:
      label: Human-readable summary of the proposed change
      description: The Atlas editor generates this automatically. Add context if useful.
    validations: { required: true }
  - type: textarea
    id: patch_json
    attributes:
      label: Machine-readable Atlas patch
      description: Generated by the Atlas update editor. If submitting manually, provide JSON with `incidentId` and a `changes` object containing only fields to replace.
      render: json
    validations: { required: true }
  - type: textarea
    id: sources
    attributes:
      label: Evidence / sources for the change
      description: One HTTPS URL per line, strongest source first.
    validations: { required: true }
  - type: textarea
    id: implications
    attributes:
      label: Does this change the interpretation or classification?
  - type: checkboxes
    id: checklist
    attributes:
      label: Submission checklist
      options:
        - label: I checked that the source supports the proposed correction.
          required: true
        - label: I understand allegations and disputed claims must remain clearly labeled.
          required: true
        - label: I understand the maintainer will independently verify this change before merging it.
          required: true
