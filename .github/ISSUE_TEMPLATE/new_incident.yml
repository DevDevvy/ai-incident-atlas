name: "Submit a new AI incident"
description: "Propose a sourced new incident, evaluation, resignation, warning, controversy, misuse case, or other event."
title: "[New incident]: "
labels: ["data-submission", "needs-verification"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing. Search existing issues and `data/incidents.json` first. Prefer primary sources and clearly distinguish evaluations from real-world incidents.
  - type: input
    id: event_date
    attributes:
      label: Event date
      description: Use the date the event happened, not merely the article publication date.
      placeholder: "2026-09-12"
    validations: { required: true }
  - type: input
    id: display_date
    attributes:
      label: Display date / range
      placeholder: "Sep 12, 2026 or Nov 17–21, 2023"
  - type: input
    id: incident_title
    attributes:
      label: Proposed factual title
      placeholder: "Anthropic researcher resigns and raises AI safety concerns"
    validations: { required: true }
  - type: input
    id: organization
    attributes:
      label: Organization / model / person
      placeholder: "Anthropic / Jane Doe"
    validations: { required: true }
  - type: dropdown
    id: evidence
    attributes:
      label: Evidence type
      options:
        - REAL — real-world incident or deployed product behavior
        - EVAL — controlled evaluation, simulation, benchmark, or red-team test
        - EVAL → REAL — evaluation crossed into real external systems or people
        - GOV — governance, resignation, whistleblower, or organizational controversy
        - LEGAL — lawsuit, court action, regulatory dispute, or rights controversy
        - MISUSE — humans deliberately used AI for harmful or malicious purposes
        - POLICY — warning, governance proposal, or institutional safety response
        - CONTESTED — material public claims remain disputed
    validations: { required: true }
  - type: dropdown
    id: category
    attributes:
      label: Primary category
      options:
        - Context milestone
        - Evaluation / red team
        - Governance & resignation
        - Human safety
        - Labor & society
        - Legal & rights
        - Misuse / deepfake
        - Model failure
        - Policy & warning
        - Privacy
        - Real-world agent failure
        - Security / cyber
    validations: { required: true }
  - type: dropdown
    id: confidence
    attributes:
      label: Confidence in the core factual claim
      options: [High, Medium, Low]
    validations: { required: true }
  - type: dropdown
    id: impact
    attributes:
      label: Suggested editorial impact
      description: Historical importance to the Atlas narrative, not a scientific risk score.
      options:
        - "1 — minor / context"
        - "2 — limited significance"
        - "3 — notable"
        - "4 — major"
        - "5 — major turning point"
    validations: { required: true }
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Give a concise factual summary. Include numbers only when directly supported.
    validations: { required: true }
  - type: textarea
    id: why
    attributes:
      label: Why does it matter?
      description: Explain what this adds to the broader AI timeline or progression.
    validations: { required: true }
  - type: textarea
    id: caveat
    attributes:
      label: What does this NOT prove / important caveat?
      description: Separate capability from intent, allegations from findings, and lab behavior from production behavior.
    validations: { required: true }
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: One source per line. Prefer primary sources first and say what each supports.
      placeholder: |
        Primary — https://example.com/report — technical incident details
        Reuters — https://reuters.com/... — independent chronology confirmation
    validations: { required: true }
  - type: textarea
    id: tags
    attributes:
      label: Suggested tags
      placeholder: "shutdown resistance, agent autonomy, cyber evaluation"
  - type: textarea
    id: themes
    attributes:
      label: Suggested Atlas themes
      placeholder: "Agents & autonomy, Cyber & containment"
  - type: textarea
    id: notes
    attributes:
      label: Additional verification notes
      description: Conflicting reports, archive links, chronology questions, or quote locations.
  - type: checkboxes
    id: checklist
    attributes:
      label: Submission checklist
      options:
        - label: I searched the existing Atlas and open issues for a duplicate.
          required: true
        - label: I clearly distinguished a controlled evaluation from a real-world incident.
          required: true
        - label: The submitted sources support the core factual claims.
          required: true
        - label: I understand the maintainer may rewrite, reclassify, merge, or decline the submission after verification.
          required: true
