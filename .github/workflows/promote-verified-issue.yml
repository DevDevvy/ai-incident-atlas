name: Promote verified incident

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: promote-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      github.event.label.name == 'verified' &&
      contains(github.event.issue.labels.*.name, 'data-submission') &&
      !contains(github.event.issue.labels.*.name, 'pr-created')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Convert verified issue into incident data
        run: node scripts/promote-verified-issue.mjs

      - name: Validate generated dataset
        run: npm run validate

      - name: Create promotion branch and commit
        id: branch
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          branch="automation/issue-${ISSUE_NUMBER}-${RUN_ID}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/incidents.json

          if git diff --cached --quiet; then
            echo "No dataset change was generated." >&2
            exit 1
          fi

          git commit -m "Promote verified incident from issue #${ISSUE_NUMBER}"
          git push origin "$branch"

      - name: Open pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          pr_url=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title "Promote verified incident from issue #${ISSUE_NUMBER}" \
            --body "Generated automatically from verified data-submission issue #${ISSUE_NUMBER}.\n\nCloses #${ISSUE_NUMBER}\n\nReview the generated record and CI checks before merging.")
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Update source issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --remove-label "needs-verification" \
            --add-label "pr-created"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "✅ Verified submission promoted automatically to a dataset pull request: ${PR_URL}\n\nThe incident is not live until that PR passes CI and is merged."

      - name: Report promotion failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "promotion-failed" || true
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "❌ Automatic promotion failed. No change has been merged into the Atlas. Review the workflow run for the validation or automation error: ${RUN_URL}" || true
